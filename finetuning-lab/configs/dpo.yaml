model_name: Qwen/Qwen2.5-0.5B-Instruct
preference_data_path: data/processed/docvqa_preferences.jsonl
output_dir: outputs/dpo
method: dpo
seed: 42
max_seq_length: 1024
num_train_epochs: 1
learning_rate: 0.00005
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
beta: 0.1
logging_steps: 10
save_strategy: epoch
use_lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj]
