model_name: Qwen/Qwen2.5-0.5B-Instruct
data_path: data/processed/docvqa_train.jsonl
output_dir: outputs/lora
method: lora
seed: 42
max_seq_length: 1024
num_train_epochs: 3
learning_rate: 0.0002
