[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-finetuning-research-lab"
version = "0.1.0"
description = "Controlled fine-tuning and alignment experiments for document intelligence"
requires-python = ">=3.10,<3.14"
dependencies = [
  "datasets>=3.0",
  "transformers>=4.51",
  "accelerate>=1.0",
  "peft>=0.14",
  "trl>=0.20",
  "bitsandbytes>=0.45; platform_system != 'Windows'",
  "evaluate>=0.4",
  "scikit-learn>=1.5",
  "pyyaml>=6.0",
  "pandas>=2.2",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
